name: "Sugerir uma melhoria"
description: "Proponha uma funcionalidade ou melhoria de experiência de integração."
title: "[Melhoria] "
body:
  - type: markdown
    attributes:
      value: |
        Sugestões são bem-vindas. Esta Issue é uma proposta, não uma autorização de implementação nem uma promessa de inclusão.
  - type: textarea
    id: need
    attributes:
      label: "Problema ou necessidade"
      description: "Que dificuldade a pessoa consumidora da biblioteca encontra atualmente?"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Solução sugerida"
      description: "Descreva o comportamento desejado e como ele seria utilizado."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: "Impacto e compatibilidade"
      description: "A proposta afeta Core, Presentation, Compose, API pública, geometria ou uso existente?"
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternativas ou referências"
      description: "Há outras formas de resolver o mesmo problema?"
    validations:
      required: false
