<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presentation V1 - Vanilla Consumer</title>
    <style>
      body {
        background-color: #f0f0f0;
        margin: 0;
        padding: 20px;
        font-family: sans-serif;
      }
      .app-container {
        display: flex;
        gap: 20px;
      }
      .controls {
        width: 200px;
      }
      button {
        display: block;
        width: 100%;
        margin-bottom: 10px;
        padding: 8px;
      }
      .document-host {
        position: relative;
        width: 816px;
        height: 2500px;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="controls">
        <button id="btn-render">Render Synthetic Snapshot</button>
        <button id="btn-clear">Clear Presentation</button>
        <button id="btn-destroy">Destroy Presentation</button>
      </div>
      <div id="host" class="document-host">
        <!-- Editor text goes here usually. For this demo, it's just the presentation layer background. -->
      </div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
