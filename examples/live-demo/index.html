<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:," />
  <title>Live Demo — Core e Presentation</title>
  <style>
    body {
      margin: 0;
      background: #e5e5e5;
      font-family: sans-serif;
    }

    #bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #222;
      color: #fff;
      padding: 6px 12px;
      font-size: 13px;
    }

    #stage {
      position: relative;
      width: var(--page-width, 816px);
      margin: 20px auto;
    }

    #presentation-host {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--page-width, 816px);
      pointer-events: none;
      z-index: 0;
    }

    #editor {
      position: relative;
      z-index: 1;
    }

    .manual .ProseMirror {
      width: var(--page-width, 816px);
      box-sizing: border-box;
      padding: var(--page-top, 96px) var(--page-right, 96px) var(--page-bottom, 96px) var(--page-left, 96px);
      outline: none;
      background: transparent;
    }

    /* A aplicação mantém o texto editável acima das folhas decorativas. */
    .coordinated .ProseMirror {
      position: relative;
      z-index: 2;
    }

    .page-break {
      border-top: 1px dashed #c00;
      height: 0;
    }

    .badge-warn {
      margin-left: 10px;
      background: #b45309;
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <div id="bar">
    conteúdo: <select id="fx"><option value="mini">mini (linear)</option>
      <option disabled>PE-S / PE-M / PE-L: tabelas fora deste schema</option></select>
    fluxo: <select id="flow"><option value="coordinated">Coordenado V1</option><option value="manual">Manual: Core + Presentation</option></select>
    modo visual: <strong>composed</strong>
    <button id="go">Recriar editor</button> <span id="diag"></span>
    <span class="badge-warn">Tabelas indisponíveis neste schema; texto, títulos e edição disponíveis</span>
  </div>
  <div id="stage">

  </div>
  <script type="module" src="./main.ts"></script>
</body>

</html>
